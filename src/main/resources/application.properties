spring.application.name=spring-boot-lab
# read artifact version - project.version in pom.xml via Maven property app.version
app.version=@app.version@

# server port
server.port=2406

# configure my own props
coach.name=Carrick
team.name=Manchester United

# manage spring boot actuator
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=health
management.info.env.enabled=true

# spring boot actuator - define app info
info.app.name=${spring.application.name}
info.app.version=${app.version}
info.app.server-port=${server.port}

# spring security
spring.security.user.name=vietlnn
spring.security.user.password=8888
logging.level.org.springframework.security=DEBUG

# context path - root path -> all requests should be prefixed with /springdemo
#server.servlet.context-path=/springdemo

# default HTTP session time out - default timeout is 30 minutes
#server.servlet.session.timeout=15m

# lazy initialization
spring.main.lazy-initialization=true

# database connection - mysql
#spring.datasource.url=jdbc:mysql://localhost:3306/employee_directory
#spring.datasource.username=springstudent
#spring.datasource.password=pwd

# database connection - postgresql
#spring.datasource.url=jdbc:postgresql://localhost:5432/springbootlab
#spring.datasource.username=postgres
#spring.datasource.password=pwd
#spring.datasource.driver-class-name=org.postgresql.Driver

# database connection - H2
spring.datasource.url=jdbc:h2:mem:springbootlab
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
## all tables are dropped and created again for JPA/Hibernate entity classes
# not recommended for enterprise prj (never use it in PROD)
spring.jpa.hibernate.ddl-auto=create
## the "update" config will keep existing data in the table
#spring.jpa.hibernate.ddl-auto=update

# turn off the Spring Boot banner
#spring.main.banner-mode=off

# reduce logging level. Set logging level to warn -> WARN and ERROR are shown
#logging.level.root=warn

# add logging configs to display SQL statements
## log SQL statements
logging.level.org.hibernate.SQL=debug
## log values for SQL statements
logging.level.org.hibernate.orm.jdbc.bind=trace

# Spring Data REST
spring.data.rest.base-path=/rest
spring.data.rest.default-page-size=10

# Spring doc Swagger UI
#springdoc.swagger-ui.path=/viet-ui.html
## view REST API docs in JSON & YAML -> /v3/api-docs or /v3/api-docs.yaml (default)
#springdoc.api-docs.path=/my-api-docs

student.countries=Germany,Spain,France,Brazil